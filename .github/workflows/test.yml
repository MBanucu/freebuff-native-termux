name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm exercises the aarch64 code path on real arm64
        # hardware. Hosted arm runners are available to public repositories;
        # drop that entry if the label is not enabled for this account.
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          bash --version | head -1
          uname -m

      - name: Syntax
        run: bash -n freebuff-native-termux.sh test/installer-test.sh test/shim-test.sh

      - name: ShellCheck (errors are fatal)
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y shellcheck
          fi
          shellcheck -S error freebuff-native-termux.sh test/installer-test.sh test/shim-test.sh

      # Advisory: the installer intentionally uses constructs ShellCheck only
      # warns about. Reported, never blocking.
      - name: ShellCheck (warnings, advisory)
        continue-on-error: true
        run: shellcheck -S warning -f gcc freebuff-native-termux.sh test/installer-test.sh test/shim-test.sh

      - name: Tests
        run: bash test/installer-test.sh

      - name: Shim tests
        run: bash test/shim-test.sh
