name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm exercises the aarch64 code path on real arm64
        # hardware. Hosted arm runners are available to public repositories;
        # drop that entry if the label is not enabled for this account.
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          bash --version | head -1
          uname -m

      - name: Syntax
        run: |
          shopt -s nullglob
          files=(freebuff-native-termux.sh lib/*.sh packaging/termux/*.sh packaging/termux/repo/*.sh ci/*.sh test/*.sh test/installer/*.sh)
          bash -n "${files[@]}"

      - name: ShellCheck (errors are fatal)
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y shellcheck
          fi
          shopt -s nullglob
          files=(freebuff-native-termux.sh lib/*.sh packaging/termux/*.sh packaging/termux/repo/*.sh ci/*.sh test/*.sh test/installer/*.sh)
          shellcheck -S error "${files[@]}"

      # Advisory: the installer intentionally uses constructs ShellCheck only
      # warns about. Reported, never blocking.
      - name: ShellCheck (warnings, advisory)
        continue-on-error: true
        run: |
          shopt -s nullglob
          files=(freebuff-native-termux.sh lib/*.sh packaging/termux/*.sh packaging/termux/repo/*.sh ci/*.sh test/*.sh test/installer/*.sh)
          shellcheck -S warning -f gcc "${files[@]}"

      - name: Tests
        run: bash test/installer-test.sh

      - name: Shim tests
        run: bash test/shim-test.sh

      - name: Repository tests
        run: bash test/repo-test.sh

      - name: TUR recipe tests
        run: bash test/tur-test.sh

      - name: Android scaffold checks
        run: bash test/android-test.sh

      # No emulator: the fake adb supplies the device table and the exit-77
      # cases are driven directly, so the fail-closed parts are checked on
      # every push.
      - name: Emulator wrapper tests (no emulator)
        run: python3 test/test_emulator_e2e.py

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      - name: Build tools
        run: |
          if ! command -v clang >/dev/null || ! command -v ld.lld >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y clang lld
          fi
          dpkg-deb --version | head -1
          clang --version | head -1

      - name: Package tests
        run: bash test/package-test.sh

      # The prebuilt shim is built for the runner's own CPU, which is also the
      # CPU of the Termux device this package would target.
      - name: Build the .deb
        run: bash packaging/termux/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: freebuff-native-deb-${{ matrix.os }}
          path: dist/*.deb
          if-no-files-found: error
