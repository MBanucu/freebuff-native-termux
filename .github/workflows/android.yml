name: android

# Builds the setup app.  The scaffold was written without an Android SDK, so
# this workflow is the compiler: it is what turns "probably builds" into an APK
# that can be installed on a device.

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'test/android-*'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: build debug apk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          manager=$(command -v sdkmanager || echo "$sdk/cmdline-tools/latest/bin/sdkmanager")
          yes | "$manager" --licenses >/dev/null 2>&1 || true
          "$manager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null
          "$manager" --list_installed | sed -n '1,15p'
          echo "sdk=$sdk" >>"$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # F-Droid builds with ./gradlew, so CI uses the wrapper too.
      - name: Wrapper
        working-directory: android
        run: ./gradlew --version | sed -n '1,8p'

      - name: Assemble
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest

      - name: Report the apk
        working-directory: android
        run: |
          for apk in app/build/outputs/apk/debug/app-debug.apk \
                     app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; do
            ls -l "$apk"
            echo "sha256 $(sha256sum "$apk" | cut -d' ' -f1)"
          done
          aapt2 dump badging "$apk" 2>/dev/null |
            grep -E "^(package|sdkVersion|targetSdkVersion|application-label|uses-permission)" |
            head -10

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freebuff-native-debug-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      # The end-to-end test needs a device, so it is not run here; this only
      # proves the test APK compiles.

      # F-Droid runs lint itself; treat ours as advice while the app is young.
      - name: Lint (advisory)
        continue-on-error: true
        working-directory: android
        run: ./gradlew --no-daemon lintDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freebuff-native-lint
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
