MaintainerNotes: |-
  This repository ships two artefacts: the Termux package (tags `v*`, e.g.
  v1.1.0) and this app (tags `android-v*`). Version checks are manual on
  purpose, because an automatic tag check would see the package tags as newer
  app versions. Bump `Builds`, `CurrentVersion` and `CurrentVersionCode` here
  together with a new `android-v*` tag.

  The app declares no INTERNET permission; the download the consent dialog
  describes is performed by Termux, not by this app. If a reviewer reads the
  permission list, that is why.

